services:
  backend:
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ENV=development
      - OPENAI_API_KEY=REVOKED_OPENAI_KEY


  frontend:
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    working_dir: /app
    environment:
      - NODE_ENV=development

    ports:
      - "3000:3000"

services:
  backend:
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ENV=development

  frontend:
    volumes:
      - ./frontend:/app
    command: npm run dev
    environment:
      - NODE_ENV=development
    ports:
      - "3000:3000"

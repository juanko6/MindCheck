services:
  # ---------- Base de datos ----------
  db:
    image: postgres:16-alpine
    container_name: mindcheck-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ---------- Backend FastAPI ----------
  backend:
    build: ./backend
    container_name: mindcheck-backend
    env_file:
      - .env                 # carga todas las variables
    depends_on:
      - db
    environment:
      # Solo repetimos aquí lo estrictamente necesario para que quede claro
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend/uploads:/app/uploads
    restart: always

  frontend:
      build:
        context: ./frontend
        args:
          # Inyectada en tiempo de build para Next.js
          NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST}:${BACKEND_PORT}${API_BASE_PATH}
      container_name: mindcheck-frontend
      env_file:
        - .env
      depends_on:
        - backend
      ports:
        - "3000:3000"
      restart: always

volumes:
  postgres_data:
services:
  backend:
    build: ./backend
    container_name: mindcheck-backend
    ports:
      - "8000:8000"
    restart: always
    environment:
      - OPENAI_API_KEY=REVOKED_OPENAI_KEY

  frontend:
    build: ./frontend
    args:
        NEXT_PUBLIC_API_URL: http://168.75.106.115:8000
    container_name: mindcheck-frontend
    ports:
      - "3000:3000"
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://168.75.106.115:8000
